<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - DisabilityConnect</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dc">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fa-solid fa-wheelchair-move"></i> DisabilityConnect</a>
    <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li></ul>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo"><i class="fa-solid fa-wheelchair-move"></i></div>
    <h3 class="text-center mb-1">Welcome Back</h3>
    <p class="text-center text-muted-dc mb-4">Login to your DisabilityConnect account</p>

    <div id="alertBox"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required aria-required="true">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required aria-required="true">
      </div>
      <button type="submit" class="btn btn-primary-dc w-100">Login</button>
    </form>

    <div class="auth-switch">
      <p>Don't have an account? <a href="register.html">Register here</a></p>
      <p class="small text-muted-dc">Admin? <a href="admin.html">Go to Admin Login</a></p>
    </div>

    <div class="small text-muted-dc mt-3 text-center">
      Demo login: <strong>user@disabilityconnect.com</strong> / <strong>password123</strong>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/login.js"></script>
</body>
</html>
