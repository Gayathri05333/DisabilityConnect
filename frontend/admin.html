<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - DisabilityConnect</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dc">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fa-solid fa-wheelchair-move"></i> DisabilityConnect</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
      <li class="nav-item" id="adminLogoutNav" style="display:none;"><a class="nav-link" href="#" onclick="adminLogout(); return false;">Logout</a></li>
    </ul>
  </div>
</nav>

<!-- Admin Login -->
<div id="adminLoginSection" class="auth-wrapper">
  <div class="auth-card">
    <div class="logo"><i class="fa-solid fa-user-shield"></i></div>
    <h3 class="text-center mb-1">Admin Login</h3>
    <p class="text-center text-muted-dc mb-4">Manage users and accessible places</p>
    <div id="alertBox"></div>
    <form id="adminLoginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Admin Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary-dc w-100">Login as Admin</button>
    </form>
    <div class="small text-muted-dc mt-3 text-center">
      Demo login: <strong>admin@disabilityconnect.com</strong> / <strong>admin123</strong>
    </div>
  </div>
</div>

<!-- Admin Dashboard -->
<main id="adminDashboardSection" class="container py-5" style="display:none;">
  <h2 class="mb-4"><i class="fa-solid fa-user-shield"></i> Admin Dashboard</h2>
  <div id="dashAlertBox"></div>

  <ul class="nav nav-pills mb-4">
    <li class="nav-item"><button class="nav-link active" id="tabUsersBtn" onclick="showTab('users')">Users</button></li>
    <li class="nav-item"><button class="nav-link" id="tabPlacesBtn" onclick="showTab('places')">Accessible Places</button></li>
  </ul>

  <!-- Users Tab -->
  <div id="usersTab">
    <h5 class="mb-3">Registered Users</h5>
    <div class="table-responsive">
      <table class="table table-bordered bg-white align-middle">
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Disability Type</th><th>Role</th></tr></thead>
        <tbody id="usersTableBody"><tr><td colspan="5">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Places Tab -->
  <div id="placesTab" style="display:none;">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="form-card">
          <h5 class="mb-3" id="placeFormTitle">Add Accessible Place</h5>
          <form id="placeForm" novalidate>
            <input type="hidden" id="placeId">
            <div class="mb-2"><label class="form-label" for="pName">Name</label><input class="form-control" id="pName" required></div>
            <div class="mb-2"><label class="form-label" for="pCategory">Category</label>
              <select class="form-select" id="pCategory">
                <option>Hospital</option><option>Park</option><option>College</option>
                <option>Shopping Mall</option><option>Government Office</option>
              </select>
            </div>
            <div class="mb-2"><label class="form-label" for="pAddress">Address</label><input class="form-control" id="pAddress"></div>
            <div class="mb-2"><label class="form-label" for="pDescription">Description</label><textarea class="form-control" id="pDescription" rows="2"></textarea></div>
            <div class="mb-2"><label class="form-label" for="pImage">Image URL</label><input class="form-control" id="pImage" placeholder="https://..."></div>
            <div class="mb-2"><label class="form-label" for="pPhone">Phone</label><input class="form-control" id="pPhone"></div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="pWheelchair">
              <label class="form-check-label" for="pWheelchair">Wheelchair Accessible</label>
            </div>
            <button type="submit" class="btn btn-primary-dc w-100" id="placeSubmitBtn">Add Place</button>
            <button type="button" class="btn btn-outline-secondary w-100 mt-2" id="cancelEditBtn" style="display:none;" onclick="resetPlaceForm()">Cancel Edit</button>
          </form>
        </div>
      </div>
      <div class="col-lg-7">
        <h5 class="mb-3">Existing Places</h5>
        <div id="placesAdminList"><p class="text-muted-dc">Loading...</p></div>
      </div>
    </div>
  </div>
</main>

<footer class="dc-footer mt-5">
  <div class="container"><p class="mb-0">&copy; 2026 DisabilityConnect.</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
