<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - DisabilityConnect</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<nav class="navbar navbar-expand-lg navbar-dc">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fa-solid fa-wheelchair-move"></i> DisabilityConnect</a>
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li id="navAuthArea" class="d-flex align-items-lg-center gap-1"></li>
      </ul>
    </div>
  </div>
</nav>

<main id="main" class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h2 class="mb-4"><i class="fa-solid fa-id-card"></i> My Profile</h2>
      <div id="alertBox"></div>
      <div class="form-card">
        <form id="profileForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input type="text" class="form-control" id="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label" for="phone">Phone</label>
            <input type="tel" class="form-control" id="phone">
          </div>
          <div class="mb-3">
            <label class="form-label" for="disabilityType">Disability Type</label>
            <select class="form-select" id="disabilityType">
              <option value="Visual">Visual</option>
              <option value="Hearing">Hearing</option>
              <option value="Mobility">Mobility</option>
              <option value="Speech">Speech</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label" for="accessibilityNeeds">Accessibility Needs</label>
            <textarea class="form-control" id="accessibilityNeeds" rows="3" placeholder="E.g. wheelchair access, sign-language interpreter, braille materials..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary-dc">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="dc-footer mt-5">
  <div class="container"><p class="mb-0">&copy; 2026 DisabilityConnect.</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
