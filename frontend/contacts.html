<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Contacts - DisabilityConnect</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<nav class="navbar navbar-expand-lg navbar-dc">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fa-solid fa-wheelchair-move"></i> DisabilityConnect</a>
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="emergency.html">Emergency SOS</a></li>
        <li id="navAuthArea" class="d-flex align-items-lg-center gap-1"></li>
      </ul>
    </div>
  </div>
</nav>

<main id="main" class="container py-5">
  <h2 class="mb-4"><i class="fa-solid fa-address-book"></i> Emergency Contacts</h2>
  <div id="alertBox"></div>

  <div class="row g-4">
    <div class="col-lg-5">
      <div class="form-card">
        <h5 class="mb-3">Add a New Contact</h5>
        <form id="contactForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="contactName">Contact Name</label>
            <input type="text" class="form-control" id="contactName" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" class="form-control" id="phone" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="relationship">Relationship</label>
            <input type="text" class="form-control" id="relationship" placeholder="E.g. Mother, Friend, Caregiver" required>
          </div>
          <button type="submit" class="btn btn-primary-dc w-100">Add Contact</button>
        </form>
      </div>
    </div>

    <div class="col-lg-7">
      <h5 class="mb-3">Your Contacts</h5>
      <div id="contactsList"><p class="text-muted-dc">Loading...</p></div>
    </div>
  </div>
</main>

<footer class="dc-footer mt-5">
  <div class="container"><p class="mb-0">&copy; 2026 DisabilityConnect.</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/contacts.js"></script>
</body>
</html>
