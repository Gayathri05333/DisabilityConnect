<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - DisabilityConnect</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dc">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fa-solid fa-wheelchair-move"></i> DisabilityConnect</a>
    <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li></ul>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 520px;">
    <div class="logo"><i class="fa-solid fa-user-plus"></i></div>
    <h3 class="text-center mb-1">Create Your Account</h3>
    <p class="text-center text-muted-dc mb-4">Join DisabilityConnect in a minute</p>

    <div id="alertBox"></div>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" required aria-required="true">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required aria-required="true">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" minlength="6" required aria-required="true">
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phone" required aria-required="true">
      </div>
      <div class="mb-3">
        <label for="disabilityType" class="form-label">Disability Type</label>
        <select class="form-select" id="disabilityType" required aria-required="true">
          <option value="">Select an option</option>
          <option value="Visual">Visual</option>
          <option value="Hearing">Hearing</option>
          <option value="Mobility">Mobility</option>
          <option value="Speech">Speech</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary-dc w-100">Register</button>
    </form>

    <div class="auth-switch">
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/register.js"></script>
</body>
</html>
